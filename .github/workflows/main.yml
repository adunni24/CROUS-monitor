name: Run CROUS AI Monitor

on:
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub Actions

jobs:
  run-monitor-agent:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Download your repository files into the runner
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Step 2: Set up a stable Python environment on the server
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install all required Python libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai pydantic playwright requests

    # Step 4: Download the headless Chromium browser binary for Playwright
    # and install system dependencies required to run a real browser in Linux
    - name: Install Playwright Chromium
      run: |
        python -m playwright install chromium --with-deps

    # Step 5: Execute your monitoring script using your secure GitHub Secrets
    - name: Run CROUS Monitor Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python monitor.py
