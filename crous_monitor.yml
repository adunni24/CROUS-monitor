name: Run CROUS AI Monitor

on:
  schedule:
    # Runs every 15 minutes (using UTC time)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

# NEW: Prevents a new run from starting if the previous one is still stuck
concurrency:
  group: crous-monitor
  cancel-in-progress: true

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai pydantic playwright requests
        playwright install chromium

    - name: Run script
      # NEW: This tells GitHub to mark the workflow as "Success" even if the Python script crashes
      continue-on-error: true 
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python crous_monitor.py
